{% extends "auth_base.html" %}
{% block content %}
<h2>Create your Atlas Pulse account</h2>
<form method="post" class="form">{% csrf_token %}
  {{ form.as_p }}
  <button class="primary">Create Account</button>
</form>
<p>Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
{% endblock %}
