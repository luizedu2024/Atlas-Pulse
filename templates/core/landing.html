{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Pulse</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="landing">
  <main>
    <img class="landing-logo" src="{% static 'img/atlas-pulse-logo.png' %}" alt="Atlas Pulse">
    <p class="eyebrow">Industrial IoT Platform</p>
    <h1>Conectar. Monitorar. Automatizar.</h1>
    <p>Uma central moderna para acompanhar dispositivos, telemetria, alertas e automações industriais em tempo real.</p>
    <div class="actions">
      <a class="button primary" href="{% url 'register' %}">Get Started</a>
      <a class="button" href="{% url 'login' %}">Sign In</a>
      <a class="button" href="https://github.com/">GitHub</a>
    </div>
  </main>
</body>
</html>
