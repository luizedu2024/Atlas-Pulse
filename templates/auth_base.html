{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Pulse</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-page">
  <section class="auth-art">
    <img class="auth-logo" src="{% static 'img/atlas-pulse-logo.png' %}" alt="Atlas Pulse">
    <p>Industrial IoT Platform</p>
    <span>Conectar. Monitorar. Automatizar. Decidir melhor.</span>
  </section>
  <main class="auth-card">
    {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
